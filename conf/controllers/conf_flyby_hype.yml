# Flyby competition profile — HYPE perpetual reserve market.
# Instrument eligibility must be confirmed by the installed Derive connector
# before launch. This profile intentionally enables no options or spot hedge.
id: flyby-hype-001
controller_name: derive_cesf_long_vol
controller_type: directional_trading
connector_name: derive
trading_pair: HYPE-PERP
total_amount_quote: 800
leverage: 2
position_mode: HEDGE
candles_connector: derive
candles_trading_pair: HYPE-PERP
interval: 1h
vol_lookback: 100
iv_threshold_vol: 2.5
cesf_epsilon: 0.088
cesf_barrier: 0.80
cesf_min_score: 0.40
svi_skew_threshold: 2.0
kelly_cap: 0.05
max_fraction: 0.03
regime: auto
stop_loss: 0.30
take_profit: 0.80
time_limit: 86400
cooldown_time: 120
executor_refresh_time: 20
collateral_asset: USDC
portfolio_margin: false
options_enabled: false
spot_hedge_enabled: false
candles_config: []
